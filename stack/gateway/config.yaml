# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# atolye model gateway (agentgateway v1.6.0).
# - Sandboxes sit on the internal network `atolye-internal` and can reach only this gateway.
# - A sandbox holds only a per-job virtual key. The runner adds and removes keys in this file (file storage mode),
#   so the admin API stays on the container's loopback, unreachable from sandboxes.
# - Every LLM request is logged as JSON with the job id and the cache token fields, so usage is counted here, per job.
config:
  statsAddr: "127.0.0.1:15020"  # metrics stay on the container's loopback, out of the sandboxes' reach
  database:
    url: sqlite:///data/data.db
  logging:
    format: json
frontendPolicies:
  accessLog:
    add:
      job: 'apiKey.job'
      cached_input_tokens: 'llm.cachedInputTokens'
      cache_creation_input_tokens: 'llm.cacheCreationInputTokens'
gateways:
  default:
    port: 4000
llm:
  policies:
    apiKey:
      mode: strict
      keys: []
  models:
  - name: qwen3.8-27b
    provider:
      custom:
        formats:
        - type: completions
    # Denylist only: agentgateway has no inbound-header allowlist (bench/t2, check 3). Known routing/billing/session
    # headers a sandbox could use to steer an upstream. Unknown headers still pass: see docs/gateway.md.
    requestHeaders:
      remove: [cookie, x-session-id, x-openrouter-title, x-openrouter-app-visibility,
               x-openrouter-experimental-metadata, http-referer, x-title, anthropic-beta, openai-organization,
               openai-project]
    params:
      model: RadixArk/Qwen3.8-27B-NVFP4
      baseUrl: "http://host.containers.internal:8000/v1"
